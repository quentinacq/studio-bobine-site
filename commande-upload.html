<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Envoyez vos rushs — Studio Bobine</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="images/favicon-32.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff8ef;--paper:#fffdf9;--ink:#2a2320;--ink-soft:#6b5f57;
    --coral:#ff6b4a;--coral-deep:#e8482a;--sun:#ffc043;--teal:#1f9e8f;--plum:#7c4dff;--line:#efe4d6;--shadow:rgba(90,60,40,.14);
    --err:#d84343;--err-bg:#fdecec;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--cream);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;line-height:1.1;font-weight:600}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:760px;margin:0 auto;padding:0 26px}
  .eyebrow{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--coral-deep);
    background:#ffe9df;padding:6px 14px;border-radius:100px;margin-bottom:18px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:600;font-size:15.5px;font-family:'DM Sans';
    padding:15px 28px;border-radius:100px;cursor:pointer;border:2px solid transparent;transition:transform .2s,box-shadow .2s,background .2s,opacity .2s}
  .btn-main{background:var(--coral);color:#fff;box-shadow:0 8px 24px rgba(255,107,74,.32)}
  .btn-main:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(255,107,74,.42)}
  .btn-main:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
  .btn-out{background:transparent;border-color:var(--ink);color:var(--ink)}

  header{position:sticky;top:0;z-index:100;background:rgba(255,248,239,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  nav{display:flex;align-items:center;justify-content:space-between;height:66px;max-width:1180px;margin:0 auto;padding:0 26px}
  .logo{font-family:'Fraunces';font-weight:700;font-size:22px;display:flex;align-items:center;gap:10px}
  .logo .reel{width:30px;height:36px;display:block;flex-shrink:0}

  main{padding:56px 0 90px}
  .stepper{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:38px}
  .stepper .sp{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink-soft)}
  .stepper .n{width:26px;height:26px;border-radius:50%;background:var(--line);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-family:'Fraunces';font-weight:700}
  .stepper .sp.on .n{background:var(--coral);color:#fff}
  .stepper .sp.on{color:var(--ink)}
  .stepper .bar{width:36px;height:2px;background:var(--line)}

  .head{text-align:center;margin-bottom:34px}
  .head h1{font-size:clamp(28px,4vw,38px);letter-spacing:-.02em;margin-bottom:10px}
  .head p{color:var(--ink-soft);font-size:16px}

  .plan-chip{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--paper);border:2px solid var(--line);
    border-radius:20px;padding:20px 24px;margin-bottom:30px}
  .plan-chip .l .tier{font-family:'Fraunces';font-size:20px;font-weight:600}
  .plan-chip .l .d{font-size:13.5px;color:var(--ink-soft);margin-top:3px}
  .plan-chip .r{font-family:'Fraunces';font-size:28px;font-weight:700;color:var(--coral-deep);white-space:nowrap}
  .plan-chip .r small{font-size:13px;color:var(--ink-soft);font-weight:400;font-family:'DM Sans'}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:36px 34px;box-shadow:0 18px 44px var(--shadow)}
  .dropzone{border:2px dashed var(--line);border-radius:18px;padding:38px 20px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;background:var(--cream)}
  .dropzone:hover,.dropzone.drag{border-color:var(--coral);background:#fff6f2}
  .dropzone .ic{font-size:32px;margin-bottom:10px}
  .dropzone .t{font-weight:600;font-size:15.5px;margin-bottom:4px}
  .dropzone .s{font-size:13px;color:var(--ink-soft)}
  .dropzone input{display:none}

  .filelist{display:flex;flex-direction:column;gap:10px;margin:18px 0}
  .fitem{display:flex;align-items:center;gap:12px;background:var(--cream);border:1px solid var(--line);border-radius:13px;padding:11px 14px}
  .fitem .ic{width:34px;height:34px;border-radius:9px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .fitem .nm{font-size:14px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fitem .du{font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
  .fitem .rm{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:18px;line-height:1;padding:4px 6px}
  .fitem .rm:hover{color:var(--err)}

  .totalrow{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ink-soft);padding:12px 2px;border-top:1px dashed var(--line);margin-top:4px}
  .totalrow b{color:var(--ink)}
  .totalrow.over b{color:var(--err)}

  .errbox{display:none;align-items:flex-start;gap:10px;background:var(--err-bg);color:var(--err);border:1px solid #f3c9c9;border-radius:14px;padding:14px 16px;font-size:14px;margin-top:14px}
  .errbox.show{display:flex}
  .errbox .ic{flex-shrink:0}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}
  .field input{width:100%;background:var(--cream);border:2px solid var(--line);border-radius:13px;
    padding:13px 15px;color:var(--ink);font-family:inherit;font-size:15px;transition:border-color .2s}
  .field input:focus{outline:none;border-color:var(--coral)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  .card .btn-main{width:100%;margin-top:8px}
  .back{display:inline-block;margin-top:22px;font-size:14px;color:var(--ink-soft)}
  .back:hover{color:var(--coral-deep)}

  @media(max-width:600px){.row2{grid-template-columns:1fr}.card{padding:28px 22px}.plan-chip{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>

<header>
  <nav>
    <a href="index.html" class="logo"><img src="images/logo-mark.png" alt="" class="reel" width="30" height="36">Studio Bobine</a>
    <a href="index.html#offres" class="btn btn-out" style="padding:10px 18px;font-size:14px">← Retour aux tarifs</a>
  </nav>
</header>

<main>
  <div class="wrap">
    <div class="stepper">
      <div class="sp on"><span class="n">1</span> Envoi des rushs</div>
      <div class="bar"></div>
      <div class="sp"><span class="n">2</span> Confirmation</div>
      <div class="bar"></div>
      <div class="sp"><span class="n">3</span> Paiement</div>
    </div>

    <div class="head">
      <span class="eyebrow">Votre commande</span>
      <h1>Envoyez vos rushs.</h1>
      <p>Glissez vos fichiers vidéo. On s'occupe du reste.</p>
    </div>

    <div class="plan-chip">
      <div class="l">
        <div class="tier" id="planTier">—</div>
        <div class="d" id="planDesc">—</div>
      </div>
      <div class="r"><span id="planPrix">—</span><small> / vidéo</small></div>
    </div>

    <div class="card">
      <label class="dropzone" id="dropzone" for="fileInput">
        <div class="ic">🎬</div>
        <div class="t">Cliquez ou glissez vos vidéos ici</div>
        <div class="s" id="dropHint">Formats courants (MP4, MOV…) — plusieurs fichiers possibles</div>
        <input type="file" id="fileInput" accept="video/*" multiple>
      </label>

      <div class="filelist" id="fileList"></div>
      <div class="totalrow" id="totalRow" style="display:none">
        <span>Durée totale des rushs envoyés</span>
        <b id="totalDuration">0:00</b>
      </div>
      <div class="errbox" id="errBox"><span class="ic">⚠️</span><span id="errText"></span></div>

      <div style="margin-top:26px;border-top:1px solid var(--line);padding-top:22px">
        <div class="field"><label for="nom">Votre nom</label><input id="nom" type="text" placeholder="Prénom Nom"></div>
        <div class="row2">
          <div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="vous@email.com"></div>
          <div class="field"><label for="tel">Téléphone</label><input id="tel" type="tel" placeholder="06 12 34 56 78"></div>
        </div>
      </div>

      <button class="btn btn-main" id="continueBtn" disabled>Continuer vers la confirmation →</button>
    </div>

    <a href="index.html#offres" class="back">← Changer de formule</a>
  </div>
</main>

<script>
  const FORMULES = {
    essentiel: { tier:'Essentiel', prix:89, dureeFinale:'jusqu\'à 3 min de vidéo finale', maxRushSec:15*60, maxRushLabel:'15 min' },
    standard:  { tier:'Standard',  prix:189, dureeFinale:'jusqu\'à 10 min de vidéo finale', maxRushSec:60*60, maxRushLabel:'1 h' }
  };

  const params = new URLSearchParams(location.search);
  const formuleKey = FORMULES[params.get('formule')] ? params.get('formule') : 'essentiel';
  const formule = FORMULES[formuleKey];

  document.getElementById('planTier').textContent = 'Formule ' + formule.tier;
  document.getElementById('planDesc').textContent = formule.dureeFinale;
  document.getElementById('planPrix').textContent = formule.prix + '€';
  document.getElementById('dropHint').textContent =
    'Formats courants (MP4, MOV…) — ' + formule.maxRushLabel + ' de rushs maximum pour cette formule';

  let files = []; // {file, name, durationSec}

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const fileList = document.getElementById('fileList');
  const totalRow = document.getElementById('totalRow');
  const totalDuration = document.getElementById('totalDuration');
  const errBox = document.getElementById('errBox');
  const errText = document.getElementById('errText');
  const continueBtn = document.getElementById('continueBtn');

  ['dragenter','dragover'].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('drag'); }));
  ['dragleave','drop'].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('drag'); }));
  dropzone.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
  fileInput.addEventListener('change', e => handleFiles(e.target.files));

  function fmtDuration(sec){
    sec = Math.round(sec);
    const m = Math.floor(sec/60), s = sec%60;
    return m + ':' + String(s).padStart(2,'0');
  }

  function handleFiles(fileListRaw){
    Array.from(fileListRaw).forEach(f => {
      if(!f.type.startsWith('video/')) return;
      const v = document.createElement('video');
      v.preload = 'metadata';
      v.onloadedmetadata = () => {
        URL.revokeObjectURL(v.src);
        files.push({ name:f.name, sizeMo:(f.size/1e6).toFixed(1), durationSec: v.duration });
        renderFiles();
      };
      v.src = URL.createObjectURL(f);
    });
  }

  function removeFile(i){ files.splice(i,1); renderFiles(); }

  function renderFiles(){
    fileList.innerHTML = files.map((f,i) => `
      <div class="fitem">
        <div class="ic">🎞️</div>
        <div class="nm">${f.name}</div>
        <div class="du">${fmtDuration(f.durationSec)} · ${f.sizeMo} Mo</div>
        <button class="rm" type="button" onclick="removeFile(${i})" aria-label="Retirer ce fichier">×</button>
      </div>`).join('');

    const total = files.reduce((s,f) => s + f.durationSec, 0);
    const over = total > formule.maxRushSec;

    if(files.length){
      totalRow.style.display = 'flex';
      totalRow.classList.toggle('over', over);
      totalDuration.textContent = fmtDuration(total) + ' / ' + formule.maxRushLabel + ' max';
    } else {
      totalRow.style.display = 'none';
    }

    if(over){
      errText.textContent = `La durée totale de vos rushs (${fmtDuration(total)}) dépasse la limite de ${formule.maxRushLabel} pour la formule ${formule.tier}. Retirez un fichier ou choisissez une formule supérieure.`;
      errBox.classList.add('show');
    } else {
      errBox.classList.remove('show');
    }

    continueBtn.disabled = files.length === 0 || over;
  }

  continueBtn.addEventListener('click', () => {
    const nom = document.getElementById('nom').value.trim();
    const email = document.getElementById('email').value.trim();
    const tel = document.getElementById('tel').value.trim();
    if(!nom || !email){ alert('Merci de renseigner votre nom et votre email.'); return; }

    const commande = {
      formuleKey, tier: formule.tier, prix: formule.prix, dureeFinale: formule.dureeFinale,
      nom, email, tel,
      fichiers: files.map(f => ({ name:f.name, sizeMo:f.sizeMo, dureeSec: Math.round(f.durationSec) })),
      dureeTotaleSec: Math.round(files.reduce((s,f)=>s+f.durationSec,0)),
      creeLe: new Date().toISOString()
    };
    // NOTE démo : les fichiers ne sont pas réellement envoyés à un stockage distant ici.
    // Avant mise en production, brancher un vrai upload (ex. Cloudflare R2 / S3 via URL signée)
    // à cet endroit, puis stocker les URLs obtenues dans `commande.fichiers`.
    sessionStorage.setItem('sb_commande', JSON.stringify(commande));
    location.href = 'commande-confirmation.html';
  });
</script>
</body>
</html>
